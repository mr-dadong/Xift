<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <clipPath id="tray-arms-clip">
      <rect x="0" y="9" width="64" height="46"/>
    </clipPath>
    <mask id="tray-gap-mask">
      <rect x="0" y="0" width="64" height="64" fill="#FFFFFF"/>
      <circle cx="32" cy="32" r="20.5" fill="#000000"/>
    </mask>
  </defs>
  <!-- Detached top-right & bottom-left arms -->
  <g clip-path="url(#tray-arms-clip)" mask="url(#tray-gap-mask)" fill="#111827">
    <polygon points="46,9 55,9 36.5,32 27.5,32"/>
    <polygon points="9,55 18,55 36.5,32 27.5,32"/>
  </g>
  <!-- Connected top-left arm -->
  <g clip-path="url(#tray-arms-clip)" fill="#111827">
    <polygon points="9,9 18,9 36.5,32 27.5,32"/>
  </g>
  <!-- Connected handle -->
  <line x1="43" y1="43" x2="53" y2="53" stroke="#111827" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Lens ring -->
  <circle cx="32" cy="32" r="15.5" fill="none" stroke="#111827" stroke-width="5"/>
  <!-- Crisp center dot for 16px legibility -->
  <circle cx="32" cy="32" r="5" fill="#111827"/>
</svg>
